name: GoSpotCheck
description: >-
  GoSpotCheck (by FORM) is a mobile field-execution and retail-execution platform
  used by field teams to collect store-level data, complete surveys and tasks
  ("missions") at places, and audit merchandising and compliance. Its External API
  lets developers sync people, places, place groups, teams, catalogs, and catalog
  items, and pull MissionResponse and TaskResponse data out of GoSpotCheck to build
  custom reports and integrations. The API is REST over HTTPS with OAuth2 bearer
  authentication, a standard response envelope (request/paging/data/errors),
  page-number pagination, field-operator filtering, related-resource includes, and
  asynchronous CSV export for large datasets.
