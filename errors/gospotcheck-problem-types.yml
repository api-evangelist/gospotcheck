envelope:
  note: >-
    Errors are returned in the standard response envelope. The `errors` hash is
    populated only when `request.status_code` is in the 400 or 500 range;
    `request.status_message` carries a human-readable message.
  fields: [request.status_code, request.status_message, errors]
problems:
