    title: Not Found
    description: Requested resource does not exist.
  - status: 422
    title: Unprocessable Entity
    description: Model validation failed; validation messages returned in the errors hash.
  - status: 500
    title: Internal Server Error
    description: Server-side error; details (when available) in the errors hash.
